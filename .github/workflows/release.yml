name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: den-aarch64-macos }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: den-x86_64-macos }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: den-x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: den-aarch64-linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: den-x86_64-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: check version matches tag
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Cargo.toml has $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        # ctui-* copies keep installs from before the rename updating.
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/den.exe ${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/den ${{ matrix.asset }}
            a="${{ matrix.asset }}"
            cp "$a" "ctui-${a#den-}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.asset }}
            ctui-*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "den $GITHUB_REF_NAME"
